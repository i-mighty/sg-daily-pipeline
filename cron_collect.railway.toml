# Railway Cron service: OpenAI Batch collector.
#
# Runs every 15 minutes. Idempotent and a no-op when no batch is in flight, so it
# is safe to run continuously. Each run polls every active batch, persists any
# completed stage's outputs, and submits the next round (research -> contact+score
# -> outreach), finalizing leads when the outreach round lands.
#
# Add this in the Railway dashboard as a SEPARATE Cron service pointing at this
# file (Settings -> Config-as-code -> cron_collect.railway.toml), sharing the same
# repo + ${{Postgres.DATABASE_URL}} and OPENAI_API_KEY as the web/cron services.
#
# Batch-mode topology (when ANALYSIS_PATH=batch):
#   1. daily   cron.railway.toml          -> run_pipeline.py --analysis-path batch   (discover + submit research round)
#   2. */15    cron_collect.railway.toml  -> batch_collect.py                         (advance rounds, finalize leads)
#   3. daily   (later)                     -> run_pipeline.py --deliver               (queue + outreach + report over done leads)
#
# In the default live mode (ANALYSIS_PATH unset), only the daily cron is needed;
# this collector simply reports "No active batches." each run.

[build]
builder = "nixpacks"

[deploy]
cronSchedule = "*/15 * * * *"
startCommand = "python scripts/batch_collect.py"
