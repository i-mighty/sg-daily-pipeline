[theme]
primaryColor = "#2563eb"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#101828"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
folderWatchBlacklist = [".venv", ".venv313", "data", "results", "scripts/__pycache__", "pages/__pycache__", "__pycache__"]

[browser]
gatherUsageStats = false
